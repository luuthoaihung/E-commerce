spring.application.name=identity-service
# Cấu hình Port chạy cho dịch vụ Java Auth (Tránh trùng với .NET và Angular)
server.port=8081

# Cấu hình kết nối SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Ecommerce_IdentityDb;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình Hibernate (JPA) tự động cập nhật cấu trúc bảng nếu có thay đổi từ code
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chuỗi này phải dài tối thiểu 32 ký tự (256-bit) để đảm bảo thuật toán mã hóa chạy an toàn
jwt.signerKey=c3VwZXItc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTMyLWNoYXJhY3RlcnMtbG9uZw==
